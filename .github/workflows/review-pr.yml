name: PR Review

# When a pull request is opened or updated, the Flue agent reviews the diff,
# posts a single review (comment / request-changes / approve), and applies a
# review label. All rules live in bot.config.yml under `review:`.
on:
  pull_request:
    types: [opened, synchronize, reopened]

# Needs write on PRs to submit reviews + labels. `pull_request` from a FORK gets
# a read-only token, so reviews are posted only for branches in this repo. (For
# fork coverage you'd switch to pull_request_target, which has security caveats.)
permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: npm ci

      - name: Review PR
        env:
          # Swap for ANTHROPIC_API_KEY if bot.config.yml uses an Anthropic model.
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          npx flue run review-pr --target node \
            --payload "{\"prNumber\": ${{ github.event.pull_request.number }}}"
